# Builds and pushes the CDP diagnostics-sidecar image: stock dotnet/monitor:10
# with the S3 egress extension built from a FRESH upstream dotnet/dotnet-monitor
# release/10.0 plus eng/maestra/patches (see eng/maestra/README.md).
#
# Modeled on maestra-io/caddy-distroless's build-and-push-ecr.yml (Teleport
# Machine ID via the per-repo image-push join token -> teleport-image-push AWS
# role). Deviation from that pattern: no gha-release-number and no GitHub
# release. Images are tagged 10-<key> (immutable; key = extension bytes +
# Dockerfile, so an unchanged build pushes nothing) plus moving `10` and
# `latest`; consumers pin by DIGEST, which DirectCRM's Renovate bumps.
name: Build and push sidecar image

on:
  push:
    branches: [release/10.0]
    paths:
      - eng/maestra/**
      - .github/workflows/sidecar-image.yml
  pull_request:
    paths:
      - eng/maestra/**
      - .github/workflows/sidecar-image.yml
  # Upstream changes arrive without a push here: rebuild daily, push only if the
  # extension bytes moved. ponytail: GitHub disables crons after 60 days without
  # repo activity; Renovate's monthly MCR digest PRs keep it alive.
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

concurrency:
  group: sidecar-image
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  ECR_REGISTRY: 515260921971.dkr.ecr.us-west-2.amazonaws.com
  AWS_REGION: us-west-2
  TELEPORT_FQDN: teleport.maestra.io:443
  TELEPORT_TOKEN: image-push-github-actions-dotnet-monitor
  AWS_ROLE_ARN: "arn:aws:iam::515260921971:role/teleport-image-push"
  IMAGE_NAME: dotnet-monitor-maestra

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILDKIT: 1
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          # No git operations downstream — don't leave a `GITHUB_TOKEN`
          # in `.git/config` for the rest of the job to find.
          persist-credentials: false

      - name: Check out upstream dotnet/dotnet-monitor release/10.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          repository: dotnet/dotnet-monitor
          ref: release/10.0
          path: upstream
          persist-credentials: false

      - name: Get Teleport version
        id: tp-version
        # Only needed when we'll authenticate (push / workflow_dispatch);
        # on pull_request we skip this + the tbot/ECR steps and only smoke-build.
        if: github.event_name != 'pull_request'
        run: |
          VERSION=$(curl -sf "https://${{ env.TELEPORT_FQDN }}/webapi/find" | jq -r '.auto_update.tools_version // .server_version')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Teleport binaries
        if: github.event_name != 'pull_request'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: ${{ runner.tool_cache }}/teleport
          key: teleport-${{ steps.tp-version.outputs.version }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install Teleport
        if: github.event_name != 'pull_request'
        uses: teleport-actions/setup@b638ff596557cc3959eb6b5287d5e58e0c8ac6a6  # v1
        with:
          version: ${{ steps.tp-version.outputs.version }}
          proxy: ${{ env.TELEPORT_FQDN }}

      - name: ECR login via Teleport Workload Identity
        if: github.event_name != 'pull_request'
        run: |
          cat > /tmp/tbot.yaml << EOF_TBOT
          version: v2
          proxy_server: ${{ env.TELEPORT_FQDN }}
          onboarding:
            join_method: github
            token: ${{ env.TELEPORT_TOKEN }}
          oneshot: true
          storage:
            type: memory
          services:
            - type: workload-identity-jwt
              destination:
                type: directory
                path: /tmp/tbot-output
              selector:
                name: image-push
              audiences: ["sts.amazonaws.com"]
          EOF_TBOT

          mkdir -p /tmp/tbot-output

          # tbot's oneshot mode spawns a heartbeat service alongside the
          # workload-identity-jwt one. The heartbeat occasionally exits with
          # "service(heartbeat) error reading from server: EOF" — a transient
          # gRPC stream close on the Teleport side — even though the JWT was
          # written successfully. Treat the JWT file's presence as the source
          # of truth instead of tbot's exit code, then validate it actually
          # works against AWS STS before trusting it for ECR.
          set +e
          tbot start -c /tmp/tbot.yaml
          TBOT_RC=$?
          set -e
          if [ ! -s /tmp/tbot-output/jwt_svid ]; then
            echo "tbot exited $TBOT_RC and did not write a JWT — failing"
            exit 1
          fi
          if [ $TBOT_RC -ne 0 ]; then
            echo "tbot exited $TBOT_RC (non-zero, but JWT was written — most likely a transient heartbeat EOF; validating with STS next)"
          fi

          export AWS_WEB_IDENTITY_TOKEN_FILE=/tmp/tbot-output/jwt_svid
          export AWS_ROLE_ARN="${{ env.AWS_ROLE_ARN }}"
          export AWS_DEFAULT_REGION=${{ env.AWS_REGION }}

          # Smoke-validate the JWT actually maps to the expected IAM role
          # before any push.
          aws sts get-caller-identity > /dev/null

          aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
            docker login ${{ env.ECR_REGISTRY }} --username AWS --password-stdin

          # 10-<sha8> tags are immutable: a published tag must never be silently
          # overwritten (2026-10-09: GitLab re-minted release numbers after a restore
          # and CI overwrote released images). The moving `latest` and `10` are
          # excluded — keep `10` in sync with the major alias pushed below.
          aws ecr describe-repositories --repository-names ${{ env.IMAGE_NAME }} --region ${{ env.AWS_REGION }} 2>/dev/null || \
          aws ecr create-repository --repository-name ${{ env.IMAGE_NAME }} --region ${{ env.AWS_REGION }} \
            --image-tag-mutability IMMUTABLE_WITH_EXCLUSION \
            --image-tag-mutability-exclusion-filters 'filterType=WILDCARD,filter=latest' 'filterType=WILDCARD,filter=10'

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      # A patch that no longer applies to upstream, or a behaviour change that
      # breaks it, fails here on every trigger, the daily one included.
      - name: Apply patches and run their unit tests
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: eng/maestra/Dockerfile
          target: test

      - name: Build the extension
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: eng/maestra/Dockerfile
          target: build
          load: true
          tags: dnm-build

      - name: Compute the image key
        id: key
        run: |
          EXT=$(docker run --rm dnm-build cat /ext.sha256)
          KEY=$({ echo "$EXT"; cat eng/maestra/Dockerfile eng/maestra/Dockerfile.dockerignore; } | sha256sum | cut -c1-12)
          {
            echo "tag=10-$KEY"
            echo "ext=$EXT"
            echo "upstream=$(git -C upstream rev-parse HEAD)"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Skip the push when the tag already exists
        id: existing
        if: github.event_name != 'pull_request'
        run: |
          IMAGE=${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}
          if docker manifest inspect "$IMAGE:${{ steps.key.outputs.tag }}" > /dev/null 2>&1; then
            echo "## ${IMAGE}:${{ steps.key.outputs.tag }} already exists, nothing changed (upstream ${{ steps.key.outputs.upstream }})" >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # BuildKit pushes only the layers ECR lacks (the stages above are cache
      # hits in the same builder); `docker push` from the fresh runner daemon
      # re-uploaded every layer of every release.
      - name: Build and push
        id: push
        if: github.event_name != 'pull_request' && steps.existing.outputs.skip != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: eng/maestra/Dockerfile
          labels: |
            org.opencontainers.image.created=${{ steps.key.outputs.created }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=dotnet-monitor-maestra
            org.opencontainers.image.vendor=maestra-io
            io.maestra.upstream-revision=${{ steps.key.outputs.upstream }}
            io.maestra.extension-sha256=${{ steps.key.outputs.ext }}
          provenance: false
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.key.outputs.tag }}
            ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:10
            ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      # The digest is what consumers pin (the image is outside the Kyverno
      # mcr.microsoft.com digest-pin policy). Surface it where a human
      # bumping the chart will look.
      - name: Summary
        if: github.event_name != 'pull_request' && steps.existing.outputs.skip != 'true'
        run: |
          {
            echo "## Pushed ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}"
            echo ""
            echo "| tag | |"
            echo "|---|---|"
            echo "| \`${{ steps.key.outputs.tag }}\` | immutable |"
            echo "| \`10\`, \`latest\` | moving |"
            echo ""
            echo "**Digest (pin this in charts):** \`${{ steps.push.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
